# On a version tag (v1.2.0), or run by hand with a version (Actions > Release > Run workflow,
# which tags the commit it runs on): tests, then a release-signed LadrokRemote.apk and LadrokRemote.aab
# (the bundle Google Play takes) attached to a GitHub Release together with their SHA-256. Both come from
# the same build, so they share one versionCode.
# Repo secrets: LADROK_KEYSTORE_B64 (base64 of the Remote's own .jks, key alias ladrok-remote) and
# LADROK_KEYSTORE_PASSWORD.
# Google Play: when the PLAY_SERVICE_ACCOUNT_JSON secret is set, the bundle also goes to Play, on the track
# in the PLAY_TRACK repo variable (default internal) with the release status in PLAY_STATUS (default
# completed; use draft while the app has never been published). Without the secret this step is skipped.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0'
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LADROK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "The LADROK_KEYSTORE_B64 secret is missing" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LADROK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          LADROK_KEYSTORE_PASSWORD: ${{ secrets.LADROK_KEYSTORE_PASSWORD }}
          LADROK_VERSION: ${{ env.VERSION }}
        run: ./gradlew assembleRelease bundleRelease --console=plain

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk LadrokRemote.apk
          cp app/build/outputs/bundle/release/app-release.aab LadrokRemote.aab
          sha256sum LadrokRemote.apk > LadrokRemote.apk.sha256
          sha256sum LadrokRemote.aab > LadrokRemote.aab.sha256
          case "$VERSION" in v[0-9]*) ;; *) echo "Version must look like v1.2.0, not $VERSION" >&2; exit 1;; esac
          # From a tag push the tag exists; from a manual run gh creates it on this commit.
          gh release create "$VERSION" LadrokRemote.apk LadrokRemote.apk.sha256 LadrokRemote.aab LadrokRemote.aab.sha256 \
            --title "Ladrok Remote $VERSION" --notes "Built from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"

      - name: Google Play
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: if [ -n "$PLAY_JSON" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"; else echo "No PLAY_SERVICE_ACCOUNT_JSON secret, skipping Google Play"; fi

      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: tv.ladrok.remote
          releaseFiles: android/LadrokRemote.aab
          releaseName: ${{ env.VERSION }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
